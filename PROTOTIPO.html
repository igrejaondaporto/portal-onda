<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Base de Apoio — igrejaonda</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
 --azul:#0019BE;--ciano:#0092D4;--lima:#D8F24B;--magenta:#FF2E88;--verde:#00A88F;--laranja:#F5A300;--violeta:#7B5CFF;
 --agua:#EAEEFF;--tinta:#0A0F2E;--cinza:#6A7192;--fio:rgba(10,15,46,.11);
 --o:'Outfit',system-ui,sans-serif;--sb:max(26px,env(safe-area-inset-bottom));
 --grad:linear-gradient(118deg,#001ED1 0%,#0019BE 52%,#001594 100%);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--o);color:var(--tinta);background:#fff;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font-family:inherit;color:inherit}
.cap{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--cinza)}
.logo{font-size:19px;letter-spacing:-.035em;line-height:1;white-space:nowrap;color:#fff}
.logo i{font-style:normal;font-weight:400}.logo b{font-weight:800}

.crista{background:var(--grad);color:#fff;padding:24px 22px 0;position:relative;overflow:hidden}
.crista::before{content:"";position:absolute;left:-60px;top:-90px;width:280px;height:280px;border-radius:50%;
 background:radial-gradient(circle,rgba(120,150,255,.34),transparent 68%)}
.crista>*{position:relative;z-index:1}
.lin{display:flex;justify-content:space-between;align-items:center}
.crista h1{font-size:clamp(40px,12vw,58px);font-weight:800;letter-spacing:-.045em;line-height:.98;margin-top:22px}
.crista h1 em{font-style:normal;color:var(--lima)}
.sob{font-size:14.5px;font-weight:400;opacity:.88;margin-top:11px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;padding-bottom:32px}
.chip{background:rgba(255,255,255,.17);border-radius:100px;padding:8px 14px;font-size:12.5px;font-weight:500}
.curva{display:block;width:100%;height:46px;margin-bottom:-2px;position:relative;z-index:1}

.folha{padding:6px 22px calc(36px + var(--sb))}
.tit{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 2px}
.tit h2{font-size:21px;font-weight:700;letter-spacing:-.03em}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:20px 8px;padding-top:18px}
.p{background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:9px;animation:ap .5s backwards}
@keyframes ap{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.av{border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:700;position:relative;flex:none;
 width:58px;height:58px;font-size:21px;transition:transform .24s cubic-bezier(.2,1.5,.4,1)}
.p:hover .av{transform:translateY(-4px)}.p:active .av{transform:scale(.9)}
.p:focus-visible{outline:3px solid var(--azul);outline-offset:4px;border-radius:12px}
.av s{position:absolute;bottom:-1px;right:-1px;width:19px;height:19px;border-radius:50%;background:var(--lima);
 color:var(--tinta);border:3px solid #fff;text-decoration:none;display:grid;place-items:center;font-size:9px;font-weight:800}
.p b{font-size:12.5px;font-weight:600;text-align:center;line-height:1.2}
.nota{margin-top:26px;font-size:12px;color:var(--cinza);line-height:1.65;max-width:430px}

.app{display:none;background:#fff}.app.on{display:block}
.eu{display:flex;align-items:center;gap:9px}
.eu b{font-size:13.5px;font-weight:600}.eu p{font-size:10px;font-weight:400;opacity:.82}
.menu{display:flex;gap:8px;padding:12px 22px;overflow-x:auto;white-space:nowrap;position:sticky;top:0;
 background:rgba(255,255,255,.96);backdrop-filter:blur(14px);z-index:5;border-bottom:1px solid var(--fio)}
.menu::-webkit-scrollbar{display:none}
.menu button{background:var(--agua);border:0;border-radius:100px;cursor:pointer;padding:9px 15px;
 font-size:13px;font-weight:600;color:var(--cinza);transition:.16s}
.menu button[data-on="1"]{background:var(--azul);color:#fff}
.corpo{padding:8px 22px calc(104px + env(safe-area-inset-bottom,0px));animation:ap .32s}
.sect{padding-top:22px}
.cabecalho{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;gap:12px}
.sect h3{font-size:19px;font-weight:700;letter-spacing:-.03em}
.linha{display:flex;gap:13px;padding:15px 0;border-bottom:1px solid var(--fio);align-items:center;animation:ap .4s backwards}
.bola{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-size:17px;font-weight:700}
.nmt{font-size:16px;font-weight:700;letter-spacing:-.025em}
.ds{font-size:12.5px;color:var(--cinza);margin-top:3px;line-height:1.45}
.seta{margin-left:auto;color:#AEB4D0;font-size:19px;flex:none}
.vaz{padding:22px 0;border-bottom:1px solid var(--fio);color:var(--cinza);font-size:13.5px;line-height:1.5}
.tag{font-size:11px;font-weight:700;color:#fff;background:var(--magenta);padding:4px 10px;border-radius:100px;flex:none}
.tag.cinz{background:var(--agua);color:var(--cinza)}
.tag.verd{background:var(--verde)}
.tag.lim{background:var(--lima);color:var(--tinta)}
.destaque{background:var(--grad);color:#fff;border-radius:22px;padding:18px 20px;margin-top:22px;
 display:flex;justify-content:space-between;align-items:center;gap:14px;cursor:pointer}
.caixa{border:1px solid var(--fio);border-radius:20px;padding:18px;margin-top:14px}
.btn{background:var(--azul);color:#fff;border:0;border-radius:100px;padding:13px 22px;font-size:14.5px;
 font-weight:600;cursor:pointer;transition:.14s}
.btn:active{transform:scale(.96)}
.btn.sec{background:var(--agua);color:var(--azul)}
.btn.full{width:100%}
.campo{width:100%;border:1px solid var(--fio);border-radius:14px;padding:13px 15px;font-size:15px;
 margin-top:8px;background:#fff}
.campo:focus{outline:2px solid var(--azul);outline-offset:0;border-color:transparent}
.rot{font-size:12.5px;font-weight:600;color:var(--cinza);margin-top:14px;display:block}
.pilha{display:flex}
.pilha em{width:32px;height:32px;border-radius:50%;border:2.5px solid #fff;display:grid;place-items:center;
 font-style:normal;font-size:12px;font-weight:700;color:#fff;margin-left:-9px}
.pilha em:first-child{margin-left:0}
.qtd{display:flex;align-items:center;gap:10px;margin-left:auto;flex:none}
.qb{width:36px;height:36px;border-radius:50%;border:1px solid var(--fio);background:#fff;font-size:19px;
 font-weight:600;cursor:pointer;line-height:1;transition:.12s}
.qb:active{background:var(--azul);color:#fff;transform:scale(.9)}
.qn{min-width:34px;text-align:center;font-size:17px;font-weight:700}
.aberto{padding:0 0 16px;font-size:13.5px;color:var(--cinza);line-height:1.6;animation:ap .3s}
.sair{margin-top:28px;background:none;border:0;color:var(--azul);font-size:13.5px;font-weight:700;cursor:pointer;padding:6px 0}

.veu{position:fixed;inset:0;background:rgba(4,8,40,.55);z-index:20;display:none}
.veu.on{display:block;animation:fd .22s}
@keyframes fd{from{opacity:0}to{opacity:1}}
.pin{position:fixed;left:0;right:0;bottom:0;z-index:21;background:#fff;border-radius:30px 30px 0 0;
 padding:12px 22px var(--sb);display:none;max-height:88vh;overflow-y:auto}
.pin.on{display:block;animation:up .34s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.pux{width:40px;height:5px;border-radius:3px;background:#DCE0F2;margin:0 auto 16px}
.cara{width:64px;height:64px;border-radius:50%;margin:0 auto;color:#fff;display:grid;place-items:center;font-size:25px;font-weight:700}
.pin h2{font-size:22px;font-weight:700;letter-spacing:-.035em;text-align:center;margin-top:14px}
.sb2{text-align:center;font-size:13px;color:var(--cinza);margin-top:5px}
.pts{display:flex;gap:12px;justify-content:center;margin:22px 0 2px}
.pts i{width:14px;height:14px;border-radius:50%;background:#DEE2F4;transition:.18s}
.pts i.on{background:var(--azul);transform:scale(1.16)}
.pts.e i{background:var(--magenta)}
.tr{animation:tr .4s}@keyframes tr{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.aviso{min-height:48px;text-align:center;padding-top:12px;font-size:13px;font-weight:600;color:var(--magenta);line-height:1.45}
.tec{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:400px;margin:6px auto 14px}
.k{height:64px;border:0;border-radius:100px;background:var(--agua);font-size:24px;font-weight:600;cursor:pointer;transition:.12s}
.k:active{background:var(--azul);color:#fff;transform:scale(.94)}
.k.g{background:none;font-size:13.5px;font-weight:600;color:var(--cinza)}
.opcao{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--fio);
 cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.opcao:active{background:var(--agua)}
.torrada{position:fixed;left:50%;bottom:calc(24px + var(--sb));transform:translateX(-50%);z-index:40;
 background:var(--tinta);color:#fff;padding:13px 20px;border-radius:100px;font-size:13.5px;font-weight:600;
 box-shadow:0 8px 30px rgba(10,15,46,.3);display:none;white-space:nowrap;max-width:92vw}
.torrada.on{display:block;animation:up2 .3s cubic-bezier(.2,.9,.3,1)}
@keyframes up2{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}

@media(min-width:900px){
 .login{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}
 .crista.entrada{padding:46px 46px 0;display:flex;flex-direction:column;justify-content:center}
 .crista.entrada h1{font-size:clamp(64px,5.4vw,92px)}
 .crista::before{width:520px;height:520px;left:-140px;top:-180px}
 .login .curva{display:none}
 .folha{padding:46px;display:flex;flex-direction:column;justify-content:center}
 .g{grid-template-columns:repeat(5,1fr);gap:26px 10px}
 .crista.topo{padding:26px 46px 0}
 .menu{padding:14px 46px}
 .corpo{padding:8px 46px 124px;max-width:1120px}
 .duas{display:grid;grid-template-columns:1.3fr .7fr;gap:0 50px;align-items:start}
 .pin{left:50%;top:50%;bottom:auto;transform:translate(-50%,-50%);width:420px;border-radius:26px;padding:24px 26px 26px}
 .pin.on{animation:zm .3s cubic-bezier(.2,.9,.3,1)}
 @keyframes zm{from{opacity:0;transform:translate(-50%,-46%)}to{opacity:1;transform:translate(-50%,-50%)}}
 .pux{display:none}
 .logo{font-size:22px}
 .navb{max-width:560px;margin:0 auto;border-radius:26px 26px 0 0}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.chk{width:34px;height:34px;border-radius:50%;border:2px solid var(--fio);background:#fff;
 cursor:pointer;flex:none;font-size:16px;color:transparent;display:grid;place-items:center;
 transition:.16s;font-weight:800}
.chk:active{transform:scale(.88)}
.chk.on{background:var(--verde);border-color:var(--verde);color:#fff}
.feita .nmt{text-decoration:line-through;opacity:.45}
.barra{height:9px;border-radius:6px;background:var(--agua);overflow:hidden;margin-top:12px}
.barra i{display:block;height:100%;background:var(--verde);border-radius:6px;transition:width .45s cubic-bezier(.2,.9,.3,1)}
.calnav{display:flex;align-items:center;gap:6px}
.calbt{width:30px;height:30px;border-radius:50%;border:1px solid var(--fio);background:#fff;
 cursor:pointer;font-size:15px;line-height:1;color:var(--cinza)}
.calbt:active{background:var(--agua)}
.semescala{margin-top:12px;padding:14px;border-radius:14px;background:var(--agua);
 font-size:13px;color:var(--cinza);font-weight:500;text-align:center}

.navb{position:fixed;left:0;right:0;bottom:0;z-index:12;background:var(--grad);
 display:none;grid-template-columns:repeat(5,1fr);
 padding:11px 4px calc(11px + env(safe-area-inset-bottom,0px));
 box-shadow:0 -10px 30px rgba(0,20,120,.18)}
.navb.on{display:grid}
.navb button{background:none;border:0;cursor:pointer;display:flex;flex-direction:column;
 align-items:center;justify-content:center;gap:6px;padding:6px 0;color:rgba(255,255,255,.6);
 font-size:11.5px;font-weight:600;letter-spacing:-.005em;transition:.18s;position:relative;min-height:56px}
.navb button svg{display:block}
.navb button::before{content:"";position:absolute;top:-11px;width:22px;height:3px;border-radius:3px;
 background:var(--lima);opacity:0;transition:opacity .2s}
.navb button[data-on="1"]{color:#fff}
.navb button[data-on="1"]::before{opacity:1}
.tabwrap{overflow-x:auto;margin-top:14px;padding-bottom:4px}
.tabwrap::-webkit-scrollbar{height:6px}
.tabwrap::-webkit-scrollbar-thumb{background:var(--fio);border-radius:6px}
.tab{border-collapse:collapse;width:100%;min-width:540px;font-size:13.5px}
.tab th{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--cinza);
 padding:11px 12px;text-align:left;border-bottom:2px solid var(--tinta);white-space:nowrap}
.tab th.hj{color:var(--azul)}
.tab td{padding:11px 12px;border-bottom:1px solid var(--fio);white-space:nowrap;font-weight:500}
.tab tr.lid td{background:var(--grad);color:#fff;font-weight:700}
.tab td.mim{color:var(--azul);font-weight:800}
.tab tr.lid td.mim{color:var(--lima)}
.tab td.papel{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--cinza)}
.tab tr.lid td.papel{color:rgba(255,255,255,.8)}
.subtabs{display:flex;gap:8px;margin-top:16px}
.subtabs button{background:var(--agua);border:0;border-radius:100px;cursor:pointer;padding:9px 16px;
 font-size:13px;font-weight:600;color:var(--cinza)}
.subtabs button[data-on="1"]{background:var(--azul);color:#fff}
</style>
<style>
/* ── calendário ── */
.cal{margin-top:14px}
.calcab{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.calcab b{font-size:16px;font-weight:700;letter-spacing:-.02em}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cald{aspect-ratio:1;border-radius:11px;display:grid;place-items:center;font-size:13.5px;
 font-weight:600;color:var(--cinza);background:#fff}

.calsem{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
 color:var(--cinza);text-align:center;padding-bottom:4px}

.cald.sirvo{background:var(--grad);color:#fff;font-weight:800}

.legenda{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px}

/* ── frase do líder ── */
.frase{background:var(--lima);border-radius:22px;padding:20px;margin-top:20px}
.frase p.txt{font-size:18px;font-weight:600;letter-spacing:-.025em;line-height:1.35}
.frase p.aut{font-size:12.5px;font-weight:600;margin-top:10px;opacity:.7}
.convite{border:1.5px dashed var(--fio);border-radius:22px;padding:20px;margin-top:20px;cursor:pointer}

/* ── foto ── */
.fotofn{width:100%;height:150px;border-radius:16px;object-fit:cover;margin:12px 0 4px;display:block}

 color:#fff;font-size:38px;font-weight:700}
</style>

.blococor .cabecalho{border:0;margin-bottom:0;padding-top:14px}
.blococor .linha{border-bottom:1px solid rgba(10,15,46,.09)}

 border-bottom:2px solid var(--tinta)}

.fasecab span{font-size:11.5px;color:var(--cinza);font-weight:500}

<script>
/* ═══════════ DADOS ═══════════ */
const COR=["#0019BE","#FF2E88","#7B5CFF","#00A88F","#F5A300","#0092D4"];
const CHEGADA="08:00", CULTO="10:30";
const FASES=[["pre","Pré-culto","Antes de abrir as portas"],
             ["durante","Durante o culto","A partir das "+CULTO],
             ["pos","Pós-culto","Depois de todos saírem"]];
const MESES=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho",

 const doMes=EVENTOS.filter(e=>e.mes===MES);

  if(ev)cl+=ev.escala.includes(EU.id)?" sirvo":" culto";
  if(MES===7&&d===2)cl+=" hoje";
  cels.push(`<div class="${cl}" ${ev?`onclick="abrirDia(${ev.id})" style="cursor:pointer"`:""}>${d}</div>`)}
 return `<div class="cal">
  <div class="calcab"><b>${MESES[MES]} 2026</b><span class="calnav">
   <button class="calbt" onclick="mudarMes(-1)" ${MES===0?"disabled style=opacity:.35":""}>‹</button>
   <button class="calbt" onclick="mudarMes(1)" ${MES===11?"disabled style=opacity:.35":""}>›</button></span></div>
  <div class="calgrid">${["S","T","Q","Q","S","S","D"].map(x=>`<div class="calsem">${x}</div>`).join("")}</div>
  <div class="calgrid" style="margin-top:5px">${cels.join("")}</div>
  ${doMes.some(e=>e.escala.length)?`<div class="legenda">
   <span class="lg"><s style="background:linear-gradient(118deg,#001ED1,#001594)"></s>Serves</span>
   <span class="lg"><s style="background:var(--agua)"></s>Culto</span>
   <span class="lg"><s style="box-shadow:inset 0 0 0 2.5px var(--lima)"></s>Hoje</span></div>`
  :`<div class="semescala">Sem escala ainda para ${MESES[MES].toLowerCase()}${EU.lider?" — define no Painel do líder":""}</div>`}
  </div>`}
function mudarMes(d){MES=Math.min(11,Math.max(0,MES+d));PAGINA==="escalas"?pgEscalas():pgInicio()}
function abrirDia(id){
 ir("escalas");
 setTimeout(()=>{const el=document.getElementById("ev"+id);
  if(el){el.scrollIntoView({behavior:"smooth",block:"start"});el.classList.add("realce");
   setTimeout(()=>el.classList.remove("realce"),1700)}},90)}

/* ═══════════ INÍCIO ═══════════ */
function pgInicio(){
 const ev=meuEvento(), minhas=minhasDe(ev), souLider=ev.liderDia===EU.id;
 const FS=funcoesDe(ev), feitas=Object.keys(ev.feito).length, total=FS.length;
 const pct=total?Math.round(feitas/total*100):0;
 cabeca(`Bom domingo,<br><em>${EU.n}</em>`,
  ev.hoje?`Serves hoje, ${ev.data}`:(ev.tipo?`Serves no ${ev.tipo}, ${ev.data}`:`Serves no domingo, ${ev.data}`),
  [`Chegada ${chegadaDe(ev)}`,`Líder de escala · ${ev.liderDia?pessoa(ev.liderDia).n:"por definir"}`,
   minhas.length?`${minhas.length} funções`:"Funções por distribuir"]);
 const pend=REEMBOLSOS.filter(r=>r.estado==="submetido");
 const ultimoFb=[...EVENTOS].reverse().find(e=>e.feedback);

 corpo.innerHTML=`
 ${EU.lider&&pend.length?`<div class="destaque" onclick="ir('reembolsos')">
   <div><p style="font-size:11px;font-weight:600;opacity:.85">A precisar de ti</p>
   <p style="font-size:17px;font-weight:700;margin-top:5px;letter-spacing:-.03em">${pend.length} pedido${pend.length>1?"s":""} de reembolso</p>
   <p style="font-size:12.5px;opacity:.9;margin-top:3px">${pessoa(pend[0].pessoa).n} · ${eur(pend[0].valor)}</p></div>
   <span style="font-size:24px">›</span></div>`:""}
 ${souLider?(ev.frase
   ?`<div class="frase"><p class="cap" style="color:rgba(10,15,46,.6)">A tua palavra para a equipa</p>
     <p class="txt" style="margin-top:8px">${ev.frase}</p>
     <button class="btn sec" style="margin-top:14px;padding:9px 16px;font-size:13px;background:rgba(10,15,46,.09);color:var(--tinta)" onclick="editarFrase(${ev.id})">Alterar</button></div>`
   :`<div class="convite" onclick="editarFrase(${ev.id})"><p class="cap">És o líder de escala de ${ev.data}</p>
     <p style="font-size:17px;font-weight:700;margin-top:7px;letter-spacing:-.03em">Deixa uma palavra à tua equipa</p>
     <p class="ds" style="margin-top:5px">Aparece no Início de todos os que servem contigo.</p></div>`)
  :(ev.frase?`<div class="frase"><p class="txt">“${ev.frase}”</p>
     <p class="aut">${pessoa(ev.liderDia).n} · líder de escala de ${ev.data}</p></div>`:"")}
 ${(souLider||EU.lider)&&ev.hoje&&!ev.feedback?`<div class="convite" onclick="editarFeedback(${ev.id})">
   <p class="cap">Depois do culto</p>
   <p style="font-size:17px;font-weight:700;margin-top:7px;letter-spacing:-.03em">Deixa o feedback deste domingo</p>
   <p class="ds" style="margin-top:5px">O que correu bem, o que faltou. Fica registado para toda a base.</p></div>`:""}

 <div class="duas"><div>
  <div class="blococor">
   <div class="cabecalho"><h3>As tuas funções</h3><span class="cap">${ev.curto}</span></div>
   ${minhas.length?FASES.map(([k,t])=>{
     const doF=ordena(ev,minhas.filter(f=>f.fase===k));
     if(!doF.length)return "";
     return `<div class="fasecab"><h4>${t}</h4><em>${doF.filter(x=>feitoDe(ev,x.id)).length}/${doF.length}</em></div>`+doF.map(f=>{const ok=feitoDe(ev,f.id);
      return `<div class="linha ${ok?"feita":""}">
       <button class="chk ${ok?"on":""}" onclick="event.stopPropagation();marcar(${ev.id},${f.id})">✓</button>
       <div style="flex:1;cursor:pointer" onclick="DIA=${ev.id};ABERTA=${f.id};ir('funcoes')">
        <p class="nmt">${f.nome}</p>
        <p class="ds">${ok?`Feito às ${ev.feito[f.id].hora}`:(quem(ev,f.id).length>1?"Contigo: "+nomes(quem(ev,f.id).filter(i=>i!==EU.id)):f.desc.slice(0,52)+"…")}</p></div>
       ${bola(f,34)}</div>`}).join("")}).join("")
    :`<div class="vaz" style="border:0">${ev.liderDia?pessoa(ev.liderDia).n+" ainda não distribuiu as funções deste domingo.":"O líder de escala ainda não foi definido."}</div>`}
  </div>

  <div class="sect"><div class="cabecalho"><h3>Como está o domingo</h3><span class="cap">${feitas} de ${total}</span></div>
   <div class="barra"><i style="width:${pct}%"></i></div>
   <p class="ds" style="margin-top:10px">${feitas===total?"Está tudo feito. Podem abrir as portas.":`Faltam ${total-feitas} tarefas.`}</p>
   <div style="display:flex;gap:8px;margin-top:14px">
    <button class="btn sec" style="flex:1;padding:11px 8px;font-size:13px" onclick="todas(${ev.id},1)">Marcar tudo</button>
    <button class="btn sec" style="flex:1;padding:11px 8px;font-size:13px" onclick="todas(${ev.id},0)">Limpar tudo</button></div>
   ${FASES.map(([k,t,d])=>{const doF=ordena(ev,FS.filter(f=>f.fase===k));
      if(!doF.length)return "";
      const fe=doF.filter(f=>feitoDe(ev,f.id)).length;
      return `<div class="fasecab"><h4>${t}</h4><em>${fe}/${doF.length}</em></div>`+doF.map(f=>linhaGeral(ev,f)).join("")}).join("")}
  </div>
 </div><div>
  <div class="sect"><div class="cabecalho"><h3>Calendário</h3></div>${calendario()}</div>
  ${ultimoFb?`<div class="sect"><div class="cabecalho"><h3>Último feedback</h3></div>
   <div class="caixa"><p style="font-size:14.5px;line-height:1.55">${ultimoFb.feedback.txt}</p>
   <p class="ds" style="margin-top:10px">${ultimoFb.feedback.autor} · ${ultimoFb.data}</p>
   <button class="btn sec full" style="margin-top:14px" onclick="ABA_CULTO='feedbacks';ir('culto')">Ver todos</button></div></div>`:""}
  <div class="sect"><div class="cabecalho"><h3>Servem contigo</h3></div>
   ${ordenada(ev).filter(i=>i!==EU.id).map(i=>{const p=pessoa(i);
     const fs=FS.filter(f=>quem(ev,f.id).includes(i));
     const fe=fs.filter(f=>feitoDe(ev,f.id)).length;
     return `<div class="linha">${avatar(p)}<div style="flex:1"><p class="nmt">${p.n}</p>
     <p class="ds">${fs.length?`${fe} de ${fs.length} feitas`:"Sem funções atribuídas"}</p></div>
     ${ev.liderDia===i?'<span class="tag lim">Líder de escala</span>':""}</div>`}).join("")}
  </div>
 </div></div>`}

function linhaGeral(ev,f){const ok=feitoDe(ev,f.id), ids=quem(ev,f.id);
 return `<div class="linha ${ok?"feita":""}">
  <button class="chk ${ok?"on":""}" onclick="marcar(${ev.id},${f.id})">✓</button>
  <div style="flex:1"><p class="nmt" style="font-size:15px">${f.nome}</p>
   <p class="ds">${ok?`${pessoa(ev.feito[f.id].por).n} · ${ev.feito[f.id].hora}`:(ids.length?nomes(ids):"Por atribuir")}</p></div>
  ${avatares(ids)}</div>`}

function marcar(eid,fid){const ev=evento(eid);
 if(ev.feito[fid]){delete ev.feito[fid];pgInicio();torrada(`${funcao(fid).nome} voltou a ficar por fazer`)}
 else{const d=new Date();
  ev.feito[fid]={por:EU.id,hora:String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")};
  pgInicio();const n=Object.keys(ev.feito).length, tt=funcoesDe(ev).length;
  torrada(n===tt?"Está tudo feito — boa equipa":`${funcao(fid).nome} ✓ · ${n} de ${tt}`)}}
function todas(eid,m){const ev=evento(eid);
 if(m){const d=new Date(),h=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  funcoesDe(ev).forEach(f=>{if(!ev.feito[f.id])ev.feito[f.id]={por:EU.id,hora:h}});pgInicio();torrada("Tudo marcado como feito")}
 else{ev.feito={};pgInicio();torrada("Checklist limpo")}}
function editarFrase(id){const ev=evento(id);
 sheet.innerHTML=`<div class="pux"></div><h2>Palavra à equipa</h2>
  <p class="sb2">${ev.data} · ${ev.escala.length} pessoas</p>
  <textarea class="campo" id="fr" rows="4" placeholder="Uma frase curta que os anima antes de começar">${ev.frase}</textarea>
  <button class="btn full" style="margin-top:16px" onclick="guardarFrase(${id})">Guardar</button>
  <button class="btn sec full" style="margin-top:9px" onclick="fecharSheet()">Cancelar</button>`;abrirSheet()}
function guardarFrase(id){evento(id).frase=document.getElementById("fr").value.trim();
 fecharSheet();pgInicio();torrada("A tua equipa vai ver isto no Início")}

/* ═══════════ ESCALA ═══════════ */
function pgEscalas(){
 const doMes=EVENTOS.filter(e=>e.mes===MES), temEscala=doMes.some(e=>e.escala.length);
 cabeca("Escala",`Os cultos de ${MESES[MES].toLowerCase()}`,
  [`${doMes.length} cultos`,temEscala?`Chegada ${CHEGADA}`:"Escala por definir"]);
 const maxLin=Math.max(0,...doMes.map(e=>e.escala.length));
 const linhas=[];
 for(let i=0;i<maxLin-1;i++)
  linhas.push(`<tr><td class="papel">${i===0?"Voluntários":""}</td>${doMes.map(ev=>{
   const o=ev.escala.filter(x=>x!==ev.liderDia), p=o[i]?pessoa(o[i]):null;
   return `<td class="${p&&p.id===EU.id?"mim":""}">${p?p.n:"—"}</td>`}).join("")}</tr>`);
 const lid=`<tr class="lid"><td class="papel">Líder de escala</td>${doMes.map(ev=>{
   const p=ev.liderDia?pessoa(ev.liderDia):null;
   return `<td class="${p&&p.id===EU.id?"mim":""}">${p?p.n:"por definir"}</td>`}).join("")}</tr>`;
 corpo.innerHTML=`
 <div class="sect"><div class="cabecalho"><h3>${MESES[MES]} 2026</h3><span class="calnav">
  <button class="calbt" onclick="mudarMes(-1)" ${MES===0?"disabled style=opacity:.35":""}>‹</button>
  <button class="calbt" onclick="mudarMes(1)" ${MES===11?"disabled style=opacity:.35":""}>›</button></span></div>
 ${temEscala?`<div class="tabwrap"><table class="tab">
   <thead><tr><th>Apoio</th>${doMes.map(ev=>`<th class="${ev.hoje?"hj":""}">${ev.curto}${ev.hoje?" · hoje":""}</th>`).join("")}</tr></thead>
   <tbody>${lid}${linhas.join("")}</tbody></table></div>
  <p class="ds" style="margin-top:12px">O teu nome aparece a azul. Desliza a tabela se não couber.</p>`
 :`<div class="semescala" style="margin-top:16px">Os ${doMes.length} cultos já existem, falta dizer quem serve.
   ${EU.lider?"Define no Painel do líder.":`O ${LIDER().n} avisa quando publicar.`}</div>`}
 </div>
 ${doMes.map(ev=>{const feitas=Object.keys(ev.feito).length;
  return `<div class="sect" id="ev${ev.id}"><div class="cabecalho">
   <h3>${ev.tipo||ev.data}${ev.hoje?' <span class="tag lim" style="vertical-align:middle">hoje</span>':""}</h3>
   ${ev.escala.includes(EU.id)?'<span class="tag verd">Serves</span>':`<span class="cap">${ev.escala.length} pessoas</span>`}</div>
  ${ev.tipo?`<p class="ds" style="padding:6px 0 2px">${ev.data} · ${ev.hora} · chegada ${chegadaDe(ev)} · ${especiaisDe(ev).length} funções só deste culto</p>`:""}
  ${ordenada(ev).map(i=>{const p=pessoa(i);
   const fs=funcoesDe(ev).filter(f=>quem(ev,f.id).includes(i));
   const fe=fs.filter(f=>feitoDe(ev,f.id)).length;
   return `<div class="linha">${avatar(p)}<div style="flex:1"><p class="nmt">${p.n}${i===EU.id?" · tu":""}</p>
   <p class="ds">${fs.length?(feitas?`${fe} de ${fs.length} feitas`:fs.length+" funções"):"sem funções atribuídas"}</p></div>
   ${ev.liderDia===i?'<span class="tag lim">Líder de escala</span>':""}</div>`}).join("")}
  ${ev.escala.length?`<button class="btn sec full" style="margin-top:12px" onclick="DIA=${ev.id};ir('funcoes')">Ver as funções deste culto</button>`
   :`<div class="vaz">Ainda ninguém escalado.${EU.lider?` <button class="btn sec" style="margin-top:10px;padding:9px 16px;font-size:13px" onclick="editarEscala(${ev.id})">Definir escala</button>`:""}</div>`}
  </div>`}).join("")}
 <p class="nota">Quem não pode servir avisa pelo WhatsApp. O ${LIDER().n} atualiza a escala aqui.</p>`}

/* ═══════════ FUNÇÕES ═══════════ */
function pgFuncoes(){
 const ev=evento(DIA), pode=podeEditar(ev), FS=funcoesDe(ev), esp=especiaisDe(ev);
 cabeca("Funções",ev.tipo?`${ev.tipo} · ${ev.data}`:"Toca numa função para ver como se faz",
  [ev.curto,ev.liderDia?`Líder de escala · ${pessoa(ev.liderDia).n}`:"Líder por definir",
   `${FS.length} funções${esp.length?` · ${esp.length} só deste culto`:""}`]);
 corpo.innerHTML=`
 <div class="menu" style="position:static;border:0;padding:14px 0 4px;background:none;backdrop-filter:none">
  ${EVENTOS.filter(e=>e.mes===evento(DIA).mes).map(e=>`<button data-on="${e.id===DIA?1:0}" onclick="DIA=${e.id};pgFuncoes()">${e.tipo?"✦ ":""}${e.curto}</button>`).join("")}</div>
 ${pode?`<div class="caixa" style="background:var(--agua);border:0">
   <p style="font-size:13.5px;font-weight:600">Podes distribuir as funções deste domingo</p>
   <p class="ds" style="margin-top:4px">${EU.lider?"És líder da base, podes editar qualquer data.":"És o líder de escala de "+ev.data+". Só podes editar este domingo."}
   Cada função aceita mais do que uma pessoa.</p></div>`
  :`<div class="caixa"><p class="ds">${ev.liderDia?pessoa(ev.liderDia).n+" é o líder de escala deste domingo e é quem distribui as funções.":"O líder de escala ainda não foi definido."}</p></div>`}
 ${pode?`<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
   ${EU.lider?`<button class="btn sec" style="flex:1;min-width:150px;padding:12px 10px;font-size:13.5px" onclick="editarFuncao(null,null)">Nova função do catálogo</button>`:""}
   <button class="btn sec" style="flex:1;min-width:150px;padding:12px 10px;font-size:13.5px" onclick="editarFuncao(null,${ev.id})">Nova função só deste culto</button>
  </div>`:""}
 ${FASES.map(([k,t,d])=>{const doF=ordena(ev,FS.filter(f=>f.fase===k));
    if(!doF.length)return "";
    const semDono=doF.filter(f=>!quem(ev,f.id).length).length;
    return `<div class="fasecab"><h4>${t}</h4><span>${d}</span><em>${semDono?semDono+" livres":"completo"}</em></div>
     ${doF.map(f=>linhaFuncao(ev,f,pode)).join("")}`}).join("")}`}

function linhaFuncao(ev,f,pode){
 const ids=quem(ev,f.id), ab=ABERTA===f.id, ok=feitoDe(ev,f.id);
 return `<div class="linha ${ok?"feita":""}" style="align-items:flex-start;cursor:pointer" onclick="abrirF(${f.id})">
  ${bola(f)}
  <div style="flex:1">
   <p class="nmt">${f.nome}</p>
   <p class="ds">${ids.length?`<b style="color:var(--azul)">${nomes(ids)}</b>${ids.includes(EU.id)?" · tu":""}`:"Por atribuir"}
 </p>
   ${ab?`<div class="aberto">
     ${f.foto?`<img src="${f.foto}" class="fotofn" alt="">`:""}
     <p style="margin-top:${f.foto?"8px":"2px"}">${f.desc||`Sem descrição. O ${LIDER().n} preenche isto no Painel.`}</p>
     <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">
      ${pode?`<button class="btn" style="padding:10px 17px;font-size:13px" onclick="event.stopPropagation();escolher(${f.id})">Quem faz</button>`:""}
      ${EU.lider?`<button class="btn sec" style="padding:10px 17px;font-size:13px" onclick="event.stopPropagation();editarFuncao(${f.id})">Editar</button>`:""}
     </div></div>`:""}</div>
  ${avatares(ids,32,13)}<span class="seta">${ab?"⌃":"⌄"}</span></div>`}

function abrirF(id){ABERTA=ABERTA===id?null:id;pgFuncoes()}
function escolher(fid){
 const ev=evento(DIA), f=funcao(fid), ids=quem(ev,fid);
 sheet.innerHTML=`<div class="pux"></div><h2>${f.nome}</h2>
  <p class="sb2">${nomeFase(f.fase)} · ${ev.data}</p>
  <p class="ds" style="text-align:center;margin-top:8px">Toca para juntar ou tirar. Podem ser várias pessoas.</p>
  <div style="margin-top:16px">
   ${ordenada(ev).map(i=>{const p=pessoa(i), sel=ids.includes(i);
    return `<button class="opcao" onclick="alternar(${fid},${i})">${avatar(p,38,15)}
     <span style="flex:1"><b style="font-size:15.5px;font-weight:700">${p.n}</b>
     <span style="display:block;font-size:12px;color:var(--cinza)">${funcoesDe(ev).filter(x=>quem(ev,x.id).includes(i)).length} funções${ev.liderDia===i?" · líder de escala":""}</span></span>
     <span class="chk ${sel?"on":""}">✓</span></button>`}).join("")}
   <button class="opcao" onclick="limparFuncao(${fid})">
    <span class="av" style="width:38px;height:38px;font-size:15px;background:var(--agua);color:var(--cinza)">—</span>
    <span style="flex:1"><b style="font-size:15.5px;font-weight:700">Deixar por atribuir</b>
    <span style="display:block;font-size:12px;color:var(--cinza)">Tira toda a gente desta função</span></span></button>
  </div>
  <button class="btn full" style="margin-top:20px" onclick="fecharSheet()">Concluir</button>`;
 abrirSheet()}
function alternar(fid,pid){const ev=evento(DIA);const l=ev.atrib[fid]||[];
 ev.atrib[fid]=l.includes(pid)?l.filter(x=>x!==pid):[...l,pid];
 escolher(fid);pgFuncoes();
 torrada(ev.atrib[fid].includes(pid)?`${pessoa(pid).n} juntou-se a ${funcao(fid).nome}`:`${pessoa(pid).n} saiu de ${funcao(fid).nome}`)}
function limparFuncao(fid){const ev=evento(DIA);ev.atrib[fid]=[];escolher(fid);pgFuncoes();
 torrada(`${funcao(fid).nome} ficou por atribuir`)}

let fotoTemp=null, faseTemp="pre", icTemp="brilho", escopoTemp=null;
function editarFuncao(id,escopo){
 const f=id?funcao(id):{nome:"",desc:"",cor:"#0019BE",ic:"brilho",foto:null,fase:"pre",evento:escopo||null};
 fotoTemp=f.foto; faseTemp=f.fase; icTemp=f.ic;
 escopoTemp=id?f.evento:(escopo||null);
 if(!EU.lider)escopoTemp=DIA;
 sheet.innerHTML=`<div class="pux"></div><h2>${id?"Editar função":"Nova função"}</h2>
  <label class="rot">Nome curto</label><input class="campo" id="fn" value="${f.nome}" placeholder="Ex.: Sala de amamentação">
  <label class="rot">Onde aparece</label>
  ${EU.lider?`<div class="subtabs" id="escopos">
    <button data-k="0" data-on="${escopoTemp?0:1}" onclick="setEscopo(null)">Todos os cultos</button>
    <button data-k="1" data-on="${escopoTemp?1:0}" onclick="setEscopo(${DIA})">Só um culto</button></div>
   <div id="qualEv" style="${escopoTemp?"":"display:none"}">
    <div class="subtabs" style="flex-wrap:wrap" id="evs">${EVENTOS.map(e=>`<button data-k="${e.id}"
     data-on="${e.id===escopoTemp?1:0}" onclick="setEscopo(${e.id})">${e.tipo?"✦ ":""}${e.curto}</button>`).join("")}</div></div>`
   :`<div class="caixa" style="background:var(--agua);border:0;margin-top:8px"><p class="ds">
    Como líder de escala, esta função entra só no culto de ${evento(DIA).tipo||evento(DIA).data}.</p></div>`}
  <label class="rot">Quando se faz</label>

      <span style="display:block;font-size:12px;color:var(--cinza)">${dentro?(lid?"líder de escala":"na escala"):"fora deste culto"}</span></span></span>
     ${dentro?`<button class="estrela ${lid?"on":""}" onclick="setLiderEsc(${id},${p.id})" title="Líder de escala">★</button>`:""}
     <span class="chk ${dentro?"on":""}" onclick="alternarEscala(${id},${p.id})" style="cursor:pointer">✓</span></div>`}).join("")}
  </div>
  <button class="btn full" style="margin-top:20px" onclick="fecharSheet()">Concluir</button>`;
 abrirSheet()}
function alternarEscala(eid,pid){const ev=evento(eid);
 if(ev.escala.includes(pid)){
  ev.escala=ev.escala.filter(x=>x!==pid);
  if(ev.liderDia===pid)ev.liderDia=null;
  Object.keys(ev.atrib).forEach(k=>{ev.atrib[k]=ev.atrib[k].filter(x=>x!==pid)});
  torrada(`${pessoa(pid).n} saiu da escala`)}
 else{ev.escala.push(pid);
  if(!ev.liderDia)ev.liderDia=pid;
  torrada(`${pessoa(pid).n} entrou na escala`)}
 editarEscala(eid);pgPainel()}
function setLiderEsc(eid,pid){evento(eid).liderDia=pid;editarEscala(eid);pgPainel();
 torrada(`${pessoa(pid).n} é o líder de escala`)}

function novoCulto(){
 sheet.innerHTML=`<div class="pux"></div><h2>Culto especial</h2>
  <p class="sb2">${MESES[MES]} 2026 · fora dos domingos</p>
  <label class="rot">Nome do culto</label>
  <input class="campo" id="cn" placeholder="Ex.: Culto de Mulheres">
  <label class="rot">Dia do mês</label>
  <input class="campo" id="cd" type="number" min="1" max="31" placeholder="14">
  <label class="rot">Hora do culto</label><input class="campo" id="ch" placeholder="20:00">
  <label class="rot">Hora de chegada da base</label><input class="campo" id="cc" placeholder="18:30">
  <p class="ds" style="margin-top:10px">Os domingos já existem todos. Isto serve para cultos fora do domingo.</p>
  <button class="btn full" style="margin-top:16px" onclick="guardarCulto()">Criar culto</button>
  <button class="btn sec full" style="margin-top:9px" onclick="fecharSheet()">Cancelar</button>`;
 abrirSheet()}
function guardarCulto(){
 const n=document.getElementById("cn").value.trim();
 const d=parseInt(document.getElementById("cd").value,10);
 const h=document.getElementById("ch").value.trim()||CULTO;
 const c=document.getElementById("cc").value.trim()||CHEGADA;
 if(!n){torrada("O culto precisa de um nome");return}
 const max=new Date(2026,MES+1,0).getDate();
 if(!d||d<1||d>max){torrada(`O dia tem de estar entre 1 e ${max}`);return}
 if(EVENTOS.some(e=>e.mes===MES&&e.dia===d)){torrada("Já existe um culto nesse dia");return}
 EVENTOS.push({id:Math.max(...EVENTOS.map(e=>e.id))+1,mes:MES,dia:d,tipo:n,hora:h,chegada:c,
  data:`${d} de ${MESES[MES].toLowerCase()}`,curto:`${String(d).padStart(2,"0")} ${MESES[MES].slice(0,3).toLowerCase()}`,
  escala:[],liderDia:null,frase:"",pdf:null,feedback:null,atrib:{},feito:{}});
 EVENTOS.sort((a,b)=>a.mes-b.mes||a.dia-b.dia);
 fecharSheet();pgPainel();torrada(`${n} criado a ${d} de ${MESES[MES].toLowerCase()}`)}

function definirLider(id){const ev=evento(id);
 sheet.innerHTML=`<div class="pux"></div><h2>Líder de escala</h2><p class="sb2">${ev.data}</p>
  <div style="margin-top:18px">${ev.escala.map(i=>{const p=pessoa(i);
   return `<button class="opcao" onclick="setLider(${id},${i})">${avatar(p,38,15)}
   <span style="flex:1"><b style="font-size:15.5px;font-weight:700">${p.n}</b></span>
   ${ev.liderDia===i?'<span class="tag verd">Atual</span>':""}</button>`}).join("")}</div>
  <button class="btn sec full" style="margin-top:18px" onclick="fecharSheet()">Fechar</button>`;abrirSheet()}
function setLider(eid,pid){evento(eid).liderDia=pid;fecharSheet();pgPainel();
 torrada(`${pessoa(pid).n} é o líder de escala`)}

let pessoaLider=false;
function editarPessoa(id){
 const p=id?pessoa(id):{n:"",tel:"",lider:false};
 pessoaLider=!!p.lider;
 const nEsc=id?EVENTOS.filter(e=>e.escala.includes(id)).length:0;
 sheet.innerHTML=`<div class="pux"></div><h2>${id?"Editar voluntário":"Novo voluntário"}</h2>
  ${id?`<p class="sb2">${nEsc} domingo${nEsc!==1?"s":""} este mês</p>`:""}
  <label class="rot">Nome</label><input class="campo" id="vn" value="${p.n}" placeholder="Nome como aparece na escala">
  <label class="rot">Telemóvel</label><input class="campo" id="vt" value="${p.tel||""}" placeholder="9xx xxx xxx">
  <label class="rot">Papel na base</label>
  <div class="subtabs" id="papeis">
   <button data-k="v" data-on="${p.lider?0:1}" onclick="setPapel(false)">Voluntário</button>
   <button data-k="l" data-on="${p.lider?1:0}" onclick="setPapel(true)">Líder da base</button></div>
  <p class="ds" style="margin-top:8px">O líder da base tem código de 6 dígitos e acesso a tudo.</p>
  <button class="btn full" style="margin-top:18px" onclick="guardarPessoa(${id||"null"})">Guardar</button>
  ${id?`<button class="btn sec full" style="margin-top:9px" onclick="torrada('${p.n} recebe um código provisório')">Repor código</button>
   ${p.id===EU.id?"":`<button class="btn sec full" style="margin-top:9px;color:var(--magenta)" onclick="confirmarRemover(${id})">Remover da base</button>`}`:""}
  <button class="btn sec full" style="margin-top:9px" onclick="fecharSheet()">Cancelar</button>`;
 abrirSheet()}
function setPapel(l){pessoaLider=l;
 [...document.getElementById("papeis").children].forEach(b=>b.dataset.on=((b.dataset.k==="l")===l)?1:0)}
function guardarPessoa(id){
 const n=document.getElementById("vn").value.trim();
 if(!n){torrada("O voluntário precisa de um nome");return}
 const tel=document.getElementById("vt").value.trim();
 if(id){const p=pessoa(id);p.n=n;p.tel=tel;
  if(pessoaLider&&!p.lider){PESSOAS.forEach(x=>x.lider=false);p.lider=true;p.dig=6;p.pin="123456"}
  else if(!pessoaLider&&p.lider){p.lider=false;p.dig=4;p.pin="1234"}
  if(p.id===EU.id)cabecaEu()}
 else{const novo={id:Math.max(...PESSOAS.map(x=>x.id))+1,n,tel,dig:pessoaLider?6:4,
   pin:pessoaLider?"123456":"1234",lider:pessoaLider,foto:null,cor:COR[PESSOAS.length%COR.length]};
  if(pessoaLider)PESSOAS.forEach(x=>x.lider=false);
  PESSOAS.push(novo)}
 fecharSheet();pgPainel();torrada(id?"Voluntário atualizado":"Voluntário adicionado")}
function confirmarRemover(id){const p=pessoa(id);
 const nEsc=EVENTOS.filter(e=>e.escala.includes(id)).length;
 sheet.innerHTML=`<div class="pux"></div><h2>Remover ${p.n}?</h2>
  <p class="sb2">${nEsc?`Está escalado em ${nEsc} domingo${nEsc!==1?"s":""}. Vai sair da escala e das funções.`:"Não está escalado em nenhum domingo."}</p>
  <p class="ds" style="text-align:center;margin-top:12px">O histórico dos domingos passados mantém-se.</p>
  <button class="btn full" style="margin-top:20px;background:var(--magenta)" onclick="removerPessoa(${id})">Remover da base</button>
  <button class="btn sec full" style="margin-top:9px" onclick="editarPessoa(${id})">Voltar atrás</button>`;
 abrirSheet()}
function removerPessoa(id){
 PESSOAS=PESSOAS.filter(p=>p.id!==id);
 EVENTOS.forEach(ev=>{ev.escala=ev.escala.filter(x=>x!==id);
  if(ev.liderDia===id)ev.liderDia=null;
  Object.keys(ev.atrib).forEach(k=>{ev.atrib[k]=ev.atrib[k].filter(x=>x!==id)})});
 fecharSheet();pgPainel();torrada("Voluntário removido da base")}

function menuEu(){
 sheet.innerHTML=`<div class="pux"></div>
  <div class="perfilav ${EU.foto?"avfoto":""}" style="width:74px;height:74px;font-size:29px;${EU.foto?`background-image:url(${EU.foto})`:`background:${EU.cor}`}">${EU.foto?"":EU.n[0]}</div>
  <h2>${EU.n}</h2><p class="sb2">${EU.lider?"Líder da base":"Voluntário da base de apoio"}</p>
  <button class="btn full" style="margin-top:20px" onclick="fecharSheet();ir('perfil')">Ver perfil</button>
  ${EU.lider?`<button class="btn sec full" style="margin-top:9px" onclick="fecharSheet();ir('painel')">Painel do líder</button>`:""}
  <button class="btn sec full" style="margin-top:9px" onclick="fecharSheet();sair()">Terminar sessão</button>
  <button class="btn sec full" style="margin-top:9px;background:none;color:var(--cinza)" onclick="fecharSheet()">Fechar</button>`;
 abrirSheet()}
function sair(){EU=null;app.classList.remove("on");navb.classList.remove("on");login.style.display="";scrollTo(0,0)}

</script>
