# O deploy do frontend (Cloudflare Workers) é à parte, por app.
# Isto trata do resto: functions, regras e índices.
name: Firebase (functions + regras)

on:
  push:
    branches: [main]
    paths: ["functions/**", "firestore.rules", "storage.rules", "firestore.indexes.json"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }

      # A credencial chega como secret e vive só o tempo do job. Sem
      # este passo o firebase-tools não tem com que se autenticar — era
      # o que faltava para o workflow correr: o ficheiro nunca era
      # criado, e todas as execuções morriam em "Failed to authenticate".
      - name: Escrever credencial de serviço
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::Falta o secret FIREBASE_SERVICE_ACCOUNT."
            echo "Firebase → Definições → Contas de serviço → Gerar nova chave privada,"
            echo "e colar o JSON inteiro em Settings → Secrets and variables → Actions."
            exit 1
          fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"

      - run: npm ci --prefix functions
      - run: npm i -g firebase-tools

      # O id do projeto vem do .firebaserc, que está versionado — não
      # precisa de secret nenhum. Menos uma coisa para configurar, e
      # menos uma para ficar dessincronizada.
      # --force: só desta vez, para apagar 2 funções órfãs
      # (alterarQuantidadeItemListaCompras/removerItemListaCompras,
      # Pessoal) que voltaram a ser escrita direta do cliente — sem
      # isto o deploy aborta em modo não-interativo, porque apagar
      # função pede confirmação. Reverter para sem --force no commit
      # seguinte, para o próximo apagão real também parar e avisar.
      - name: Deploy
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: firebase deploy --only functions,firestore:rules,firestore:indexes,storage --non-interactive --force

      # Regra do projeto: um deploy de functions não está terminado
      # enquanto o smoke não passar. `node --check` apanha erro de
      # sintaxe; um erro de runtime (o .exists() do Admin SDK, que já
      # partiu o ecrã de entrada em produção) só aparece a chamar a
      # função a sério.
      - name: Smoke
        run: npm ci && npm run smoke

      - if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
