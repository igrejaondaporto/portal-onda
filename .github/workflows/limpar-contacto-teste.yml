# Apaga o contacto de teste "Ana Teste Silva" criado ao validar o
# Formulário (scripts/limparContactoTeste.mjs). Uso único — corre
# manualmente, apaga-se a seguir (workflow e script).
#
# Uso: gh workflow run limpar-contacto-teste.yml --repo igrejaondaporto/portal-onda
name: Limpar contacto de teste (manual, uma vez)

on:
  workflow_dispatch:

jobs:
  limpar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }

      - name: Escrever credencial de serviço
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::Falta o secret FIREBASE_SERVICE_ACCOUNT."
            exit 1
          fi
          printf '%s' "$SA" > service-account.json

      - run: npm ci
      - run: node scripts/limparContactoTeste.mjs

      - if: always()
        run: rm -f service-account.json
