# Semeia alguns itens de exemplo no Inventário da Base Pessoal
# (scripts/seedInventarioPessoal.mjs) — corre manualmente, uma vez.
#
# Uso: gh workflow run seed-inventario-pessoal.yml --repo igrejaondaporto/portal-onda
#
# Ficheiro temporário — apagar depois de usado (mesmo padrão de
# seed-pessoal.yml).
name: Semear Inventário da Pessoal (manual)

on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }

      - name: Escrever credencial de serviço
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::Falta o secret FIREBASE_SERVICE_ACCOUNT."
            exit 1
          fi
          printf '%s' "$SA" > service-account.json

      - run: npm ci
      - run: node scripts/seedInventarioPessoal.mjs

      - if: always()
        run: rm -f service-account.json
